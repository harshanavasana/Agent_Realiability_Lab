name: ARL Continuous Integration Pipeline

on:
  push:
    branches: [ main, week-* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic fastapi httpx opentelemetry-api opentelemetry-sdk

      - name: Run Pytest Unit & Integration Suite
        run: |
          python -m pytest -v
          